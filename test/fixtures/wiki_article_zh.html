    <h1 id="firstHeading">二项式定理</h1>
    <div id="mw-content-text">
      <p>二项式定理是初等代数中的一条重要定理，它描述了二项式的整数次幂的展开式。<sup class="reference">[1]</sup>该定理由艾萨克·牛顿在十七世纪加以推广。</p>
      <p>在组合数学中，二项式定理的系数与<a rel="mw:WikiLink" href="./组合数">组合数</a>、<a rel="mw:WikiLink" href="./杨辉三角">杨辉三角</a>密切相关，常用于概率论与数理统计的推导。</p>
      <p>该定理在数学归纳法与生成函数中都有重要应用。</p>
      <p>该定理的推广形式包括<a rel="mw:WikiLink" href="./File:Newton.jpg">配图</a>与<a href="./Category:代数学">分类</a>，这两类链接不应进入兔子洞。</p>
